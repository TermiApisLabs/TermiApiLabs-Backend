services:
  postgres:
    image: postgres:17-alpine
    container_name: termiapislabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: termiapislabs
      POSTGRES_USER: ${DB_USERNAME:-termiapislabs_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - termiapislabs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-termiapislabs_app} -d termiapislabs"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: termiapislabs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/termiapislabs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  termiapislabs-postgres:
