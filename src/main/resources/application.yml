server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: termiapislabs-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/termiapislabs}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  google-client-id: ${GOOGLE_CLIENT_ID:change-me.apps.googleusercontent.com}
  jwt:
    secret: ${JWT_SECRET:change_me_change_me_change_me_change_me_change_me_change_me_change_me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  auth-code:
    secret: ${AUTH_CODE_SECRET:change_me_change_me_change_me_change_me}
    expiration-minutes: ${AUTH_CODE_EXPIRATION_MINUTES:15}
    resend-cooldown-seconds: ${AUTH_CODE_RESEND_COOLDOWN_SECONDS:60}
  mail-from: ${SMTP_FROM:noreply@example.com}
